[package]
name = "anim-wasm"
version = "0.1.0"
edition = "2024"

# cdylib → the browser artifact; rlib → lets `cargo test -p anim-wasm` drive
# the same entry points on the host.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
animations = { path = "../animations", features = ["std"] }
embedded-graphics-core = "0.4.1"
serde_json = "1.0"
