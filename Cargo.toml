[workspace]
resolver = "2"
exclude = ["slave_radio"]
members = [
    "animations",
    "anim_wasm",
    "defmt_tcp",
    "embedded_tools",
    "firmware",
    "led_core",
    "rp235x_embedded_tools",
    "radio_link",
    "rp235x_ota",
    "sim",
    "ws_client",
]

[profile.release]
debug = 2
lto = true
opt-level = 'z'

# Render hot path only: `z` taxes the animation draw loops badly on the
# M33 (soft-ish float + no unrolling in the per-pixel code). Keep this
# per-crate — the wifi build has only ~20 K of 508 K slot headroom, so
# widening the override (or raising firmware/led-core too) requires
# re-measuring both firmware sizes; see AGENTS.md "Firmware sizes".
[profile.release.package.animations]
opt-level = "s"

# Browser build of the preview engine (`anim_wasm`): the artifact is
# base64-inlined into the single-file SPA bundle served by the board, so
# every byte here costs 4/3 in the bundle and one more on the OTA link.
# Never used for embedded targets.
[profile.release-wasm]
inherits = "release"
debug = false
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
