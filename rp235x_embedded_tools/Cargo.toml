[package]
name = "rp235x-embedded-tools"
version = "0.1.0"
edition = "2024"
authors = ["Chris Dell <cjdell@gmail.com>"]
description = "RP235x specific trait implementations"

[dependencies]
defmt = "1.0.1"
block_device = "0.1.3"
littlefs-rust = "0.1.0"

embedded-tools = { path = "../embedded_tools" }

embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", features = [
    "defmt",
] }
embassy-rp = { git = "https://github.com/embassy-rs/embassy.git", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp235xa",
    "binary-info",
] }
